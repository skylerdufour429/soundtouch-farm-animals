<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundTouch Farm Animals</title>
    <meta
      name="description"
      content="Static animal sound archive for SoundTouch farm animal cards."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wrap">
        <div>
          <p class="eyebrow">SoundTouch</p>
          <h1>Farm Animal Archive</h1>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="toolbar" aria-label="Animal filter controls">
        <button class="chip active" data-filter="all" type="button">All</button>
        <button class="chip" data-filter="mammal" type="button">Mammals</button>
        <button class="chip" data-filter="bird" type="button">Birds</button>
        <button class="chip" data-filter="amphibian" type="button">Amphibians</button>
      </section>

      <section id="gallery" class="gallery" aria-live="polite"></section>
    </main>

    <template id="animal-card-template">
      <article class="card">
        <div class="card-art">
          <img class="animal-image" src="" alt="" loading="lazy" />
          <div class="placeholder" aria-hidden="true">🐾</div>
        </div>
        <div class="card-body">
          <div class="title-row">
            <h2 class="animal-name"></h2>
            <span class="animal-count"></span>
          </div>
          <p class="animal-meta"></p>
          <div class="controls">
            <button class="play-button" type="button">Play sound</button>
          </div>
        </div>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
